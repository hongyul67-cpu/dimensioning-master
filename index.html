<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치수기입 마스터</title>
<style>
  :root{
    --bg:#0f1319; --panel:#171c25; --panel2:#1f2531; --line:#2c3442;
    --text:#e8ecf3; --sub:#8a94a6; --accent:#22c55e; --accent2:#38bdf8;
    --good:#34d399; --bad:#f87171; --draw:#dfe6f0; --dim:#f59e0b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);
    font-family:"Pretendard","Segoe UI",-apple-system,sans-serif;
    min-height:100vh;padding:20px 14px 60px;line-height:1.6;}
  .wrap{max-width:1040px;margin:0 auto;}
  header{margin-bottom:18px;}
  h1{font-size:23px;margin:0 0 4px;font-weight:800;}
  h1 span{color:var(--accent);}
  .sub{color:var(--sub);font-size:13px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
  .hidden{display:none !important;}

  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;
    cursor:pointer;transition:.15s;text-align:left;color:var(--text);font-family:inherit;}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .card .ico{font-size:30px;}
  .card h3{margin:8px 0 4px;font-size:16px;}
  .card p{margin:0;color:var(--sub);font-size:12.5px;}
  .bar{height:6px;background:#0c0f14;border-radius:99px;margin-top:12px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .4s;}
  .bar-t{font-size:11px;color:var(--sub);margin-top:5px;}

  .topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .btn{border:none;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.15s;}
  .btn-p{background:var(--accent);color:#04240f;}
  .btn-p:hover{filter:brightness(1.1);}
  .btn-g{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn-g:hover{border-color:var(--sub);}
  .btn-s{background:var(--accent2);color:#04222e;}
  .spacer{flex:1;}
  .tag{font-size:11.5px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);
    padding:4px 10px;border-radius:99px;}

  .learn{display:grid;gap:12px;}
  .lcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .lcard h4{margin:0 0 8px;font-size:15px;color:var(--accent);}
  .lcard p{margin:0 0 8px;font-size:13.5px;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin-top:8px;}
  .kv b{color:var(--accent2);white-space:nowrap;}
  .note{font-size:12px;color:var(--sub);border-left:3px solid var(--accent);padding-left:10px;margin-top:8px;}
  .bad-note{font-size:12px;color:#fca5a5;border-left:3px solid var(--bad);padding-left:10px;margin-top:8px;}
  ul{margin:6px 0 0;padding-left:18px;font-size:13px;}
  li{margin-bottom:4px;}

  .symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px;}
  .sym{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;}
  .sym .big{font-size:26px;font-weight:800;color:var(--dim);font-family:"Times New Roman",serif;}
  .sym .nm{font-size:12.5px;font-weight:700;margin-top:4px;}
  .sym .dt{font-size:11px;color:var(--sub);}

  .figbox{background:#141922;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;text-align:center;}
  .figbox svg{max-width:100%;height:auto;}
  .figcap{font-size:11.5px;color:var(--sub);margin-top:6px;}

  .q{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;}
  .qtext{font-size:16px;font-weight:700;margin-bottom:12px;line-height:1.5;}
  .opts{display:grid;gap:9px;}
  .opt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    cursor:pointer;font-size:14px;text-align:left;color:var(--text);font-family:inherit;
    display:flex;align-items:center;gap:10px;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt .mk{width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
  .opt.ok{border-color:var(--good);background:rgba(52,211,153,.12);}
  .opt.no{border-color:var(--bad);background:rgba(248,113,113,.1);}
  .opt:disabled{cursor:default;}
  .fb{margin-top:14px;padding:13px 15px;border-radius:10px;font-size:13.5px;display:none;line-height:1.6;}
  .fb.ok{display:block;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);color:var(--good);}
  .fb.no{display:block;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.3);color:#fca5a5;}
  .fb b{color:var(--text);}
  .prog{height:7px;background:#0c0f14;border-radius:99px;overflow:hidden;margin:10px 0 4px;}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s;}
  .qnum{font-size:12px;color:var(--sub);font-weight:700;}

  .result{text-align:center;padding:26px 18px;}
  .result .big{font-size:52px;}
  .score-ring{font-size:40px;font-weight:800;color:var(--accent);}
  .wrongbox{text-align:left;margin-top:18px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:14px;font-size:13px;max-height:280px;overflow-y:auto;}
  .wrongbox h4{margin:0 0 8px;font-size:13px;color:var(--bad);}
  .wrongbox div{padding:7px 0;border-bottom:1px solid var(--line);}
  .wrongbox div:last-child{border-bottom:none;}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--panel2);
    border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;
    z-index:999;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .toast.ok{border-color:var(--good);color:var(--good);}
  .toast.no{border-color:var(--bad);color:#fca5a5;}
  @media (max-width:600px){ h1{font-size:20px;} .qtext{font-size:15px;} }
  /* 오답노트 (규약 §2) */
  /* 오답노트는 그림·해설까지 들어가 길어진다 — 280px 상자 안에 가두지 않고 다 펼친다 */
  .wrongbox.review{max-height:none;overflow:visible;}
  .wrongbox .rvcard{border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px;margin:10px 0;text-align:left;}
  .wrongbox .rvcard .figbox{margin:8px 0;}
  .wrongbox .rvcard div{border-bottom:none;padding:0;}
  .wrongbox .rvno{font-size:.8rem;opacity:.7;margin-bottom:6px;}
  .wrongbox .rvrow{font-size:.92rem;margin:4px 0;}
  .wrongbox .rvrow.ans{font-weight:700;color:var(--good);}
  .wrongbox .rvex{font-size:.88rem;line-height:1.6;opacity:.9;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>치수기입 <span>마스터</span></h1>
    <div class="sub">치수 기입 요소 · 치수 보조기호 · 기입 원칙 — 배우고 나서 문제로 확인하세요</div>
  </header>

  <div id="home">
    <div class="panel"><div class="home-grid" id="homeGrid"></div></div>
    <div class="panel">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-size:15px;font-weight:800;">🏁 종합 점검 (20문항)</div>
          <div class="sub" style="font-size:12.5px;">세 영역을 섞어 출제합니다. 결과를 선생님께 제출할 수 있어요.</div>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-p" onclick="startExam()">종합 점검 시작</button>
      </div>
      <div class="bar" style="margin-top:12px;"><i id="examBar"></i></div>
      <div class="bar-t" id="examTxt">아직 응시하지 않았습니다</div>
    </div>
  </div>

  <div id="learnView" class="hidden">
    <div class="topnav">
      <button class="btn btn-g" onclick="goHome()">← 홈</button>
      <div class="tag" id="learnTitle"></div>
      <div class="spacer"></div>
      <button class="btn btn-p" onclick="fromLearnToQuiz()">문제 풀기 →</button>
    </div>
    <div class="panel"><div class="learn" id="learnBody"></div></div>
    <div style="text-align:center;margin-bottom:20px;">
      <button class="btn btn-p" onclick="fromLearnToQuiz()">배웠으니 문제 풀어보기 →</button>
    </div>
  </div>

  <div id="quizView" class="hidden">
    <div class="topnav">
      <button class="btn btn-g" onclick="goHome()">← 홈</button>
      <div class="tag" id="quizTitle"></div>
      <div class="spacer"></div>
      <div class="tag" id="quizScore">0점</div>
    </div>
    <div class="prog"><i id="quizProg"></i></div>
    <div class="qnum" id="quizCount" style="margin-bottom:10px;"></div>
    <div class="q" id="quizBody"></div>
    <div style="text-align:right;margin-top:14px;">
      <button class="btn btn-p hidden" id="nextBtn">다음 →</button>
    </div>
  </div>

  <div id="resultView" class="hidden">
    <div class="panel result">
      <div class="big" id="rEmoji">🎉</div>
      <h2 id="rTitle"></h2>
      <div class="score-ring" id="rScore"></div>
      <div class="sub" id="rSub" style="margin-top:6px;"></div>
      <div id="rWrong"></div>
      <div style="margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-g" onclick="goHome()">홈으로</button>
        <button class="btn btn-s" id="retryBtn">다시 풀기</button>
        <button class="btn btn-p hidden" id="rcSubmitBtn" onclick="rcSubmit()">🧑‍🏫 선생님께 제출</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   치수기입 마스터 — 기초제도 Ⅱ단원(도면의 치수 기입) 기준
   ========================================================= */

/* ---------- 도면 그림(SVG) ---------- */
const P='var(--draw)', D='var(--dim)';
function fig(inner,w,h){
  return `<svg width="${w||330}" height="${h||150}" viewBox="0 0 ${w||330} ${h||150}">
    <g fill="none" stroke="${P}" stroke-width="1.8" stroke-linecap="round">${inner}</g></svg>`;
}
/* 치수 기입 4요소 설명 그림 */
function figElements(){
  return `<svg width="340" height="165" viewBox="0 0 340 165">
    <!-- 물체 외형선 -->
    <rect x="60" y="30" width="150" height="60" fill="none" stroke="${P}" stroke-width="2.2"/>
    <!-- 치수 보조선 -->
    <line x1="60" y1="92" x2="60" y2="130" stroke="${D}" stroke-width="1.4"/>
    <line x1="210" y1="92" x2="210" y2="130" stroke="${D}" stroke-width="1.4"/>
    <!-- 치수선 + 화살표 -->
    <line x1="60" y1="122" x2="210" y2="122" stroke="${D}" stroke-width="1.4"/>
    <path d="M60 122 L70 118.5 L70 125.5 Z" fill="${D}"/>
    <path d="M210 122 L200 118.5 L200 125.5 Z" fill="${D}"/>
    <text x="128" y="117" fill="${D}" font-size="14" font-weight="700">150</text>
    <!-- 라벨 -->
    <text x="222" y="126" fill="#8a94a6" font-size="11">① 치수선</text>
    <text x="222" y="108" fill="#8a94a6" font-size="11">② 치수 보조선</text>
    <text x="222" y="144" fill="#8a94a6" font-size="11">③ 화살표</text>
    <text x="100" y="146" fill="#8a94a6" font-size="11">④ 치수 숫자</text>
    <line x1="218" y1="122" x2="212" y2="122" stroke="#8a94a6" stroke-width="1"/>
    <line x1="218" y1="104" x2="212" y2="98" stroke="#8a94a6" stroke-width="1"/>
  </svg>`;
}
/* 치수선 간격 규칙 */
function figSpacing(){
  return `<svg width="330" height="160" viewBox="0 0 330 160">
    <rect x="50" y="20" width="140" height="50" fill="none" stroke="${P}" stroke-width="2.2"/>
    <line x1="50" y1="72" x2="50" y2="140" stroke="${D}" stroke-width="1.2"/>
    <line x1="190" y1="72" x2="190" y2="140" stroke="${D}" stroke-width="1.2"/>
    <line x1="120" y1="72" x2="120" y2="112" stroke="${D}" stroke-width="1.2"/>
    <line x1="50" y1="95" x2="120" y2="95" stroke="${D}" stroke-width="1.4"/>
    <path d="M50 95 L59 92 L59 98 Z" fill="${D}"/><path d="M120 95 L111 92 L111 98 Z" fill="${D}"/>
    <text x="76" y="90" fill="${D}" font-size="13" font-weight="700">70</text>
    <line x1="50" y1="130" x2="190" y2="130" stroke="${D}" stroke-width="1.4"/>
    <path d="M50 130 L59 127 L59 133 Z" fill="${D}"/><path d="M190 130 L181 127 L181 133 Z" fill="${D}"/>
    <text x="110" y="125" fill="${D}" font-size="13" font-weight="700">140</text>
    <text x="200" y="99" fill="#8a94a6" font-size="10.5">작은 치수를 안쪽에</text>
    <text x="200" y="134" fill="#8a94a6" font-size="10.5">큰 치수를 바깥쪽에</text>
  </svg>`;
}
/* 보조기호 예시 도형 */
function figSymbolUse(){
  return `<svg width="330" height="120" viewBox="0 0 330 120">
    <circle cx="60" cy="60" r="32" fill="none" stroke="${P}" stroke-width="2.2"/>
    <line x1="38" y1="38" x2="82" y2="82" stroke="${D}" stroke-width="1.3"/>
    <text x="86" y="86" fill="${D}" font-size="14" font-weight="700">φ64</text>
    <path d="M170 92 A40 40 0 0 1 210 52" fill="none" stroke="${P}" stroke-width="2.2"/>
    <line x1="210" y1="52" x2="240" y2="30" stroke="${D}" stroke-width="1.3"/>
    <text x="243" y="30" fill="${D}" font-size="14" font-weight="700">R40</text>
    <text x="150" y="112" fill="#8a94a6" font-size="10.5">지름은 φ, 반지름은 R</text>
  </svg>`;
}
/* 잘못된 치수 기입 예 — 중복 */
function figDuplicate(){
  return `<svg width="330" height="150" viewBox="0 0 330 150">
    <rect x="55" y="25" width="150" height="55" fill="none" stroke="${P}" stroke-width="2.2"/>
    <line x1="55" y1="82" x2="55" y2="120" stroke="${D}" stroke-width="1.2"/>
    <line x1="130" y1="82" x2="130" y2="120" stroke="${D}" stroke-width="1.2"/>
    <line x1="205" y1="82" x2="205" y2="140" stroke="${D}" stroke-width="1.2"/>
    <line x1="55" y1="100" x2="130" y2="100" stroke="${D}" stroke-width="1.4"/>
    <text x="82" y="96" fill="${D}" font-size="13" font-weight="700">75</text>
    <line x1="130" y1="100" x2="205" y2="100" stroke="${D}" stroke-width="1.4"/>
    <text x="157" y="96" fill="${D}" font-size="13" font-weight="700">75</text>
    <line x1="55" y1="132" x2="205" y2="132" stroke="#f87171" stroke-width="1.6"/>
    <text x="120" y="128" fill="#f87171" font-size="13" font-weight="700">150</text>
    <text x="215" y="136" fill="#f87171" font-size="11">← 중복!</text>
  </svg>`;
}

/* ---------- 데이터: 치수 보조기호 ---------- */
const SYMBOLS = [
  {s:'φ',  nm:'지름',        dt:'원의 지름 앞에 붙임',        ex:'φ50 = 지름 50mm'},
  {s:'R',  nm:'반지름',      dt:'원호의 반지름 앞에 붙임',    ex:'R20 = 반지름 20mm'},
  {s:'□',  nm:'정사각형의 변',dt:'정사각형 한 변 앞에 붙임',  ex:'□30 = 한 변 30mm인 정사각형'},
  {s:'t',  nm:'두께',        dt:'판의 두께를 나타냄',         ex:'t3 = 두께 3mm'},
  {s:'C',  nm:'45° 모따기',  dt:'45도로 깎아낸 크기',         ex:'C2 = 45°로 2mm 모따기'},
  {s:'Sφ', nm:'구의 지름',   dt:'구(공) 모양의 지름',         ex:'Sφ40 = 구의 지름 40mm'},
  {s:'SR', nm:'구의 반지름', dt:'구(공) 모양의 반지름',       ex:'SR25 = 구의 반지름 25mm'},
  {s:'( )',nm:'참고 치수',   dt:'참고로만 표시하는 치수',     ex:'(80) = 참고 치수 80mm'},
  {s:'⌒',  nm:'원호의 길이', dt:'호(arc)의 길이를 나타냄',    ex:'⌒50 = 호의 길이 50mm'}
];

/* ---------- 배우기 ---------- */
const LEARN = {
  elem:{title:'치수 기입의 요소', cards:[
    {h:'치수 기입에 쓰이는 4가지 요소', html:`
      <div class="figbox">${figElements()}<div class="figcap">치수선·치수 보조선·화살표·치수 숫자</div></div>
      <div class="kv">
        <b>① 치수선</b><span>가는 실선. 치수를 재는 방향으로 긋고 양 끝에 화살표를 붙임</span>
        <b>② 치수 보조선</b><span>가는 실선. 외형선에서 끌어내며 <b>치수선을 2~3mm 넘게</b> 그림</span>
        <b>③ 화살표</b><span>치수선의 끝을 나타냄. 한 도면에서는 모양과 크기를 같게</span>
        <b>④ 치수 숫자</b><span>치수선 <b>중앙 위쪽</b>에 기입. 단위 mm는 쓰지 않음</span>
      </div>
      <div class="note">도면의 치수 단위는 <b>mm</b>이며, 단위 기호는 <b>붙이지 않습니다</b>.</div>`},
    {h:'치수선 긋는 규칙', html:`
      <div class="figbox">${figSpacing()}<div class="figcap">작은 치수는 안쪽, 큰 치수는 바깥쪽</div></div>
      <ul>
        <li>치수선은 외형선에서 <b>10mm 정도 띄워서</b> 긋는다</li>
        <li>치수선끼리는 <b>같은 간격</b>으로 나란히 긋는다</li>
        <li><b>작은 치수를 안쪽</b>, 큰 치수를 바깥쪽에 배치해 치수선이 교차하지 않게 한다</li>
        <li>치수선은 서로 <b>교차시키지 않는다</b></li>
      </ul>`},
    {h:'치수 숫자 쓰는 방향', html:`
      <ul>
        <li><b>수평 방향</b> 치수: 도면의 <b>아래쪽</b>에서 읽을 수 있도록 기입</li>
        <li><b>수직 방향</b> 치수: 도면의 <b>오른쪽</b>에서 읽을 수 있도록 기입</li>
        <li>경사 방향도 위 두 원칙에 준해 기입한다</li>
      </ul>
      <div class="note">치수 숫자는 치수선과 <b>겹치지 않게</b> 하고, 다른 선이 치수 숫자를 지나가지 않도록 합니다.</div>`}
  ]},
  sym:{title:'치수 보조기호', cards:[
    {h:'치수 보조기호 한눈에', html:`
      <p>치수 숫자 <b>앞에</b> 붙여서 그 치수가 무엇을 뜻하는지 나타냅니다.</p>

  S.qs=shuffle(BANK[area]()).slice(0,12);
  S.idx=0;S.score=0;S.wrong=[];S.rev=[];S.startAt=Date.now();
  document.getElementById('quizTitle').textContent=AREA[area].ico+' '+AREA[area].name;
  show('quizView');renderQ();
}
function startExam(){
  S.mode='exam';S.area=null;
  S.qs=shuffle([].concat(shuffle(bankElem()).slice(0,7),shuffle(bankSym()).slice(0,7),shuffle(bankRule()).slice(0,6)));
  S.idx=0;S.score=0;S.wrong=[];S.rev=[];S.startAt=Date.now();
  document.getElementById('quizTitle').textContent='🏁 종합 점검 (20문항 · 시험)';
  show('quizView');renderQ();
}
function renderQ(){
  const q=S.qs[S.idx];S.answered=false;
  document.getElementById('quizCount').textContent=`문제 ${S.idx+1} / ${S.qs.length}`;
  document.getElementById('quizProg').style.width=(S.idx/S.qs.length*100)+'%';
  // 시험은 진행 중 점수를 감춘다 (규약 §2)
  document.getElementById('quizScore').textContent=isExam()?'채점은 마지막에':S.score+'점';
  document.getElementById('nextBtn').classList.add('hidden');
  const ansText=q.ansText!=null?q.ansText:q.opts[q.a];
  document.getElementById('quizBody').innerHTML=
    `<div class="qtext">${q.q}</div>${q.fig?`<div class="figbox">${q.fig}</div>`:''}
     <div class="opts" id="opts"></div><div class="fb" id="fb"></div>`;
  const wrap=document.getElementById('opts');
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="mk">${String.fromCharCode(65+i)}</span><span>${o}</span>`;
    b.onclick=()=>answer(i,o===ansText,ansText,q);
    wrap.appendChild(b);
  });
}
function isExam(){ return S.mode==='exam'; }
function answer(i,correct,ansText,q){
  if(S.answered)return;S.answered=true;
  const opts=[...document.querySelectorAll('#opts .opt')];
  const picked=opts[i]?opts[i].querySelector('span:last-child').textContent:'';
  opts.forEach(b=>b.disabled=true);
  if(correct)S.score++;
  // 틀린 문제는 "내가 고른 답 → 정답"으로 남긴다 (규약 §1 ②)
  if(!correct)S.wrong.push({q:q.q.replace(/<[^>]+>/g,''),pick:picked,ans:ansText});
  const fb=document.getElementById('fb');
  if(isExam()){
    // 시험 — 정답 표시·해설·알림까지 전부 감추고 오답노트용으로만 담아 둔다 (규약 §2)
    (S.rev=S.rev||[]).push({no:S.idx+1,q:q.q,fig:q.fig,ex:q.ex,ok:correct,pick:picked,ans:ansText});
    fb.className='fb';fb.innerHTML='제출했어요 · 채점은 마지막에 한꺼번에 합니다';
    document.getElementById('quizScore').textContent='채점은 마지막에';
  } else {
    opts.forEach((b,bi)=>{
      const txt=b.querySelector('span:last-child').textContent;
      if(txt===ansText)b.classList.add('ok');else if(bi===i)b.classList.add('no');
    });
    if(correct){fb.className='fb ok';fb.innerHTML='✅ <b>정답!</b><br>'+q.ex;toast('정답!','ok');}
    else{fb.className='fb no';fb.innerHTML=`❌ <b>정답은 «${ansText}»</b><br>`+q.ex;toast('아쉬워요','no');}
    document.getElementById('quizScore').textContent=S.score+'점';
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}
document.getElementById('nextBtn').onclick=()=>{S.idx++;if(S.idx>=S.qs.length)finish();else renderQ();};
function finish(){
  const total=S.qs.length,pct=Math.round(S.score/total*100),pass=pct>=70;
  if(window.RankKit) RankKit.award(pct);   /* 랭킹전 RP 정산 */
  document.getElementById('rEmoji').textContent=pct>=90?'🏆':pass?'🎉':'💪';
  document.getElementById('rTitle').textContent=pct>=90?'훌륭해요! 완벽에 가까워요':pass?'합격! 잘 이해했어요':'조금만 더 연습해요';
  document.getElementById('rScore').textContent=`${S.score} / ${total} (${pct}%)`;
  const sec=Math.round((Date.now()-S.startAt)/1000);
  document.getElementById('rSub').textContent=
    `${S.mode==='exam'?'종합 점검':AREA[S.area].name} · 소요 시간 ${Math.floor(sec/60)}분 ${sec%60}초`;
  document.getElementById('rWrong').innerHTML = isExam() ? examReview()
    : (S.wrong.length
      ?`<div class="wrongbox"><h4>틀린 문제 ${S.wrong.length}개 — 다시 확인하세요</h4>
        ${S.wrong.map(w=>`<div>• ${w.q}<br><span style="color:var(--good)">→ 정답: ${w.ans}</span></div>`).join('')}</div>`
      :`<div class="wrongbox" style="color:var(--good)">틀린 문제가 없습니다! 완벽해요 🎯</div>`);
  const rec={correct:S.score,total:total,pct:pct};
  if(S.mode==='exam'){if(!S.examBest||pct>S.examBest.pct)S.examBest=rec;}
  else{if(!S.best[S.area]||pct>S.best[S.area].pct)S.best[S.area]=rec;}
  save();
  document.getElementById('rcSubmitBtn').classList.remove('hidden');
  document.getElementById('retryBtn').onclick=()=>S.mode==='exam'?startExam():startQuiz(S.area);
  show('resultView');
}
/* 오답노트 — 시험이 끝난 뒤에야 틀린 문제를 그림·해설과 함께 펼쳐 보여준다 (규약 §2) */
function examReview(){
  const wrongs=(S.rev||[]).filter(r=>!r.ok);
  if(!wrongs.length) return '<div class="wrongbox" style="color:var(--good)">틀린 문제가 없습니다! 완벽해요 🎯</div>';
  return '<div class="wrongbox review"><h4>📝 오답노트 — 틀린 '+wrongs.length+'문제</h4>'+
    wrongs.map(r=>
      '<div class="rvcard">'+
      '<div class="rvno">문제 '+r.no+'</div>'+
      '<div class="qtext">'+r.q+'</div>'+
      (r.fig?'<div class="figbox">'+r.fig+'</div>':'')+
      '<div class="rvrow">내 답 — '+(r.pick||'무응답')+'</div>'+
      '<div class="rvrow ans">정답 — '+r.ans+'</div>'+
      (r.ex?'<div class="rvex">'+r.ex+'</div>':'')+
      '</div>').join('')+'</div>';
}
let tTimer=null;
function toast(msg,kind){
  const t=document.getElementById('toast');clearTimeout(tTimer);
  t.className='toast '+(kind||'');t.textContent=msg;t.style.display='block';
  tTimer=setTimeout(()=>{t.style.display='none';},1100);
}
function rcHasEndpoint(){return !!(window.ResultCollector&&ResultCollector.config&&ResultCollector.config.endpoint);}
function rcSubmit(){
  if(!rcHasEndpoint()){
    alert(['이 링크로는 제출이 되지 않아요.','',
           '선생님이 나눠 준 제출용 링크(주소 뒤에 ?rc=... 가 붙은 링크)로',
           '들어와야 반·번호를 입력하고 결과를 보낼 수 있습니다.','',
           '연습은 지금 이대로 계속 하셔도 됩니다.'].join(String.fromCharCode(10)));
    return;
  }
  const total=S.qs.length, sec=Math.round((Date.now()-S.startAt)/1000);
  const modeName = '치수기입 — ' + (S.mode==='exam' ? '종합 점검' : AREA[S.area].name);
  ResultCollector.open({
    score:Math.round(S.score/total*100),
    correct:S.score, total:total,
    // 무엇을 골라서 틀렸는지까지 남긴다 (규약 §1 ②)
    wrong:S.wrong.map(w=>`${w.q} ${w.pick||'무응답'}→${w.ans}`),
    durationSec:sec,
    mode:modeName,
    retry: ResultCollector.bumpTry ? ResultCollector.bumpTry(modeName) : undefined,
    extra: S.mode==='exam' ? ["치수 기입 종합 이해"] : ['치수기입 개념 이해']
  });
}
renderHome();show('home');
</script>

<script src="https://hongyul67-cpu.github.io/links/rank.js" data-tool="제도 마스터"></script>
<script>
/* ── 랭킹전(공용 계급) + 생기부 키워드 ──
   · 랭킹: 같은 data-tool("제도 마스터")을 쓰는 도구끼리 RP(랭크 포인트)가 하나로 쌓인다.
   · 생기부: 제출할 때 활동명·도전횟수·계급이 자동으로 얹혀 키워드·문장 초안이 만들어진다. */
(function(){
  var MODE_NAME = '치수기입 마스터';
  var TRY_KEY   = 'try_제도';

  function bumpTry(m){
    var d={}; try{ d=JSON.parse(localStorage.getItem(TRY_KEY))||{}; }catch(e){}
    d[m]=(d[m]||0)+1;
    try{ localStorage.setItem(TRY_KEY, JSON.stringify(d)); }catch(e){}
    return d[m];
  }
  /* 도구마다 화면 구조가 달라, 계급은 화면 구석 배지로 공통 표시한다 */
  function paintBadge(){
    if(!window.Rank || !document.body) return;
    var el=document.getElementById('rk-badge');
    if(!el){
      el=document.createElement('div'); el.id='rk-badge';
      el.style.cssText='position:fixed;right:10px;bottom:10px;z-index:9998;'
        +'font-size:11.5px;opacity:.9;pointer-events:none';
      document.body.appendChild(el);
    }
    try{ el.innerHTML=Rank.badge(); }catch(e){}
  }
  window.RankKit = {
    mode: MODE_NAME,
    /* 채점이 끝난 지점에서 호출 — RP 정산 + 승급 연출 */
    award: function(pct, mode){
      if(!window.Rank) return null;
      var rk=null;
      try{ rk=Rank.award(pct, {mode: mode||MODE_NAME}); }catch(e){}
      paintBadge();
      if(rk && rk.tierUp && window.FX){
        try{ FX.banner({icon:rk.tierAfter.icon, title:rk.tierAfter.name+' 승급!',
                        sub:rk.after+' RP · '+rk.tierAfter.full, stars:3}); }catch(e){}
      }
      return rk;
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', paintBadge);
  else paintBadge();

  /* 생기부 — 제출 payload 에 활동명·도전횟수·계급을 자동으로 붙인다 */
  var t=setInterval(function(){
    if(!window.ResultCollector) return;
    clearInterval(t);
    if(ResultCollector.__kit) return;
    ResultCollector.__kit=1;
    var orig=ResultCollector.open;
    ResultCollector.open=function(p){
      p=p||{};
      var m=p.mode||MODE_NAME;
      p.mode=m;
      if(p.retry===undefined) p.retry=bumpTry(m);
      if(p.tier===undefined && window.Rank){ try{ p.tier=Rank.get().tier.full; }catch(e){} }
      return orig.call(this,p);
    };
  }, 60);
})();
</script>
